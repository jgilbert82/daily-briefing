name: Daily Briefing

on:
  schedule:
    # 04:00 UTC = 06:00 Copenhagen (summer/CEST)
    # Change to '0 5 * * 1-5' for winter (CET, UTC+1)
    - cron: '0 4 * * 1-5'
  workflow_dispatch:
  repository_dispatch:
    types: [refresh-briefing]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests anthropic google-auth google-auth-httplib2 google-api-python-client

      # Publishes straight to Gilbert Data Hub (PUT /api/briefing); nothing is committed.
      - name: Generate briefing
        env:
          GDH_API_URL: ${{ secrets.GDH_API_URL }}
          GDH_API_TOKEN: ${{ secrets.GDH_API_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: python generate.py
